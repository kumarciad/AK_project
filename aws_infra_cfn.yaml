AWSTemplateFormatVersion: '2010-09-09'
Description: AK Project Flask App Infrastructure - VPC, ALB, ECS Fargate, RDS Postgres, ECR, IAM

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Environment Configuration" }
        Parameters: [EnvironmentName, DBUsername, DBPassword, DBName, FlaskSecretKey]
      - Label: { default: "ECS / Container Configuration" }
        Parameters: [ContainerImage, ContainerPort, DesiredCount, ECSTaskCPU, ECSTaskMemory]

Parameters:
  EnvironmentName:
    Type: String
    Default: ak-project-prod
    Description: Environment name used as prefix for resource names
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9-]*$
    MinLength: 1
    MaxLength: 32

  DBUsername:
    Type: String
    Default: akadmin
    Description: PostgreSQL master username
    MinLength: 2
    MaxLength: 16
    NoEcho: true

  DBPassword:
    Type: String
    Description: PostgreSQL master password (min 12 chars)
    MinLength: 12
    MaxLength: 64
    NoEcho: true

  DBName:
    Type: String
    Default: akprojectdb
    Description: PostgreSQL database name
    MinLength: 1
    MaxLength: 63

  FlaskSecretKey:
    Type: String
    Description: Flask SECRET_KEY (random long string)
    MinLength: 16
    NoEcho: true

  ContainerImage:
    Type: String
    Default: ""
    Description: "ECR image URI: <account>.dkr.ecr.<region>.amazonaws.com/ak-project:latest (leave empty to skip initial ECS service deployment)"

  ContainerPort:
    Type: Number
    Default: 5000
    MinValue: 1
    MaxValue: 65535

  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10

  ECSTaskCPU:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]

  ECSTaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096", "8192"]

Conditions:
  HasContainerImage: !Not [!Equals [!Ref ContainerImage, ""]]

Resources:

  # =========================
  #  NETWORK: VPC, Subnets, IG, NAT, Route Tables
  # =========================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-b

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-b

  NatGatewayAEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat-a-eip

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayAEIP.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat-a

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # =========================
  #  SECURITY GROUPS
  # =========================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP(S) from anywhere to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-alb-sg

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB to Flask containers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-app-sg

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access from app containers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-db-sg

  # =========================
  #  DATABASE: RDS PostgreSQL
  # =========================

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-db-subnet-group

  PostgresDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${EnvironmentName}-postgres
      DBName: !Ref DBName
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: "16"
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: "20"
      MaxAllocatedStorage: "100"
      StorageType: gp2
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 7
      DeletionProtection: false
      EnableIAMDatabaseAuthentication: false
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-postgres

  DBSSMParameterEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}/db/endpoint
      Type: String
      Value: !GetAtt PostgresDB.Endpoint.Address

  DBSSMParameterPort:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}/db/port
      Type: String
      Value: !GetAtt PostgresDB.Endpoint.Port

  # =========================
  #  LOAD BALANCER
  # =========================

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${EnvironmentName}-alb
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Scheme: internet-facing
      Type: application
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-alb

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${EnvironmentName}-app-tg
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /login
      HealthCheckPort: traffic-port
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: "200,301,302"
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-app-tg

  ALBHTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP

  # =========================
  #  ECS CLUSTER + FARGATE SERVICE
  # =========================

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-cluster

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-task-exec-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub ${EnvironmentName}-ssm-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - secretsmanager:GetSecretValue
                  - kms:Decrypt
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-task-exec-role

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-task-role

  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ak-project
      ImageScanningConfiguration:
        scanOnPush: true
      ImageTagMutability: MUTABLE
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPushPull
            Effect: Allow
            Principal:
              AWS: !Ref "AWS::AccountId"
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:DescribeRepositories
              - ecr:DescribeImages

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasContainerImage
    Properties:
      Family: !Sub ${EnvironmentName}-flask
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ECSTaskCPU
      Memory: !Ref ECSTaskMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: ak-project-flask
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              HostPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: FLASK_APP
              Value: wsgi.py
            - Name: FLASK_ENV
              Value: production
            - Name: PYTHONUNBUFFERED
              Value: "1"
            - Name: ENVIRONMENT_NAME
              Value: !Ref EnvironmentName
          Secrets:
            - Name: SECRET_KEY
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/flask/secret-key
            - Name: DB_HOST
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/db/endpoint
            - Name: DB_PORT
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/db/port
            - Name: DB_USER
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/db/username
            - Name: DB_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/db/password
            - Name: DB_NAME
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/db/name
          HealthCheck:
            Command: ["CMD-SHELL", "curl -f http://localhost:5000/login || exit 1"]
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: flask
          MountPoints: []

  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}/flask
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-logs

  ECSService:
    Type: AWS::ECS::Service
    Condition: HasContainerImage
    DependsOn: [ALBHTTPListener]
    Properties:
      ServiceName: !Sub ${EnvironmentName}-flask-svc
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref AppSecurityGroup
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: ak-project-flask
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref ALBTargetGroup
      HealthCheckGracePeriodSeconds: 120

  FlaskSecretSSMParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}/flask/secret-key
      Type: SecureString
      Value: !Ref FlaskSecretKey

  DBUsernameSSMParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}/db/username
      Type: SecureString
      Value: !Ref DBUsername

  DBPasswordSSMParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}/db/password
      Type: SecureString
      Value: !Ref DBPassword

  DBNameSSMParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}/db/name
      Type: SecureString
      Value: !Ref DBName

  JenkinsDeployIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-jenkins-deploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref "AWS::AccountId"
            Action: sts:AssumeRole
            Condition: {}
      ManagedPolicyArns: []
      Policies:
        - PolicyName: !Sub ${EnvironmentName}-jenkins-deploy-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRPushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetAuthorizationToken
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                Resource: "*"
              - Sid: ECSTaskDeploy
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RunTask
                  - ecs:StopTask
                  - application-autoscaling:RegisterScalableTarget
                  - application-autoscaling:PutScalingPolicy
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticbeanstalk:*
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-jenkins-deploy-role

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${EnvironmentName}-vpc-id

  PublicSubnetAId:
    Description: Public subnet A
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub ${EnvironmentName}-public-a

  PublicSubnetBId:
    Description: Public subnet B
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub ${EnvironmentName}-public-b

  PrivateSubnetAId:
    Description: Private subnet A
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub ${EnvironmentName}-private-a

  PrivateSubnetBId:
    Description: Private subnet B
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub ${EnvironmentName}-private-b

  ALBDNSName:
    Description: Load Balancer DNS - visit this URL to see the app
    Value: !Sub http://${ALB.DNSName}
    Export:
      Name: !Sub ${EnvironmentName}-alb-dns

  ALBTargetGroupArn:
    Description: ALB Target Group ARN
    Value: !Ref ALBTargetGroup
    Export:
      Name: !Sub ${EnvironmentName}-tg-arn

  ECSClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${EnvironmentName}-ecs-cluster

  ECRRepositoryUri:
    Description: ECR Repository URI (for docker push)
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ak-project
    Export:
      Name: !Sub ${EnvironmentName}-ecr-uri

  DBEndpoint:
    Description: RDS Endpoint address
    Value: !GetAtt PostgresDB.Endpoint.Address

  DBPort:
    Description: RDS Port
    Value: !GetAtt PostgresDB.Endpoint.Port

  JenkinsDeployRoleArn:
    Description: IAM Role ARN for Jenkins to assume during deploy
    Value: !GetAtt JenkinsDeployIAMRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-jenkins-role-arn

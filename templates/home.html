
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .home-container {
            text-align: center;
            color: white;
        }
        .home-container h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .home-container p {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .btn-secondary {
            background: white;
            color: #667eea;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <h1>Welcome, {{ current_user.username }}!</h1>
        <p>You have successfully logged in.</p>
        <a href="{{ url_for('logout') }}" class="btn btn-secondary" style="text-decoration: none; display: inline-block; width: auto; padding: 12px 30px;">Logout</a>
    </div>
</body>
</html>
